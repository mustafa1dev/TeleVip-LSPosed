name: Plus probe
on:
  push:
    branches: [claude/plus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Try sources
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          echo "== apkeep"
          curl -fsSL -o apkeep https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu && chmod +x apkeep
          ./apkeep --help | head -60
          mkdir -p out
          ./apkeep -a org.telegram.plus -d apk-pure -o accept_dangers=true out 2>&1 | tail -5 || true
          ./apkeep -l -a org.telegram.plus -d apk-pure -o accept_dangers=true 2>&1 | tail -15 || true
          ls -la out || true
          echo "== apkmirror"
          curl -sSL -m 60 -A "$UA" https://www.apkmirror.com/apk/rafalense/plus-messenger/ > am.html; wc -c am.html
          grep -o 'href="/apk/rafalense/plus-messenger/plus-messenger-[^"]*-release/"' am.html | sort -u | head -8
          echo "== uptodown"
          curl -sSL -m 60 -A "$UA" https://plus-messenger.en.uptodown.com/android/download > ud.html; wc -c ud.html
          grep -o 'data-url="[^"]*"' ud.html | sort -u | head; grep -o '<div class="version">[^<]*' ud.html | head -3
          grep -o 'id="detail-download-button"[^>]*' ud.html | head -3
