name: Plus probe
on:
  push:
    branches: [claude/plus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/project-thread-lu3doz
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check
        run: |
          curl -fsSL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu && chmod +x /tmp/apkeep
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)
          for v in 13.0.2.0 12.10.5.0; do
            rm -rf dl; mkdir dl
            /tmp/apkeep -a org.telegram.plus@$v -d apk-pure -o 'acknowledge_dangers=true,arch=arm64-v8a' dl 2>&1 | tail -3
            ls -la dl; f=$(ls dl/* | head -n1)
            if unzip -l "$f" manifest.json >/dev/null 2>&1; then
              echo "xapk:"; unzip -l "$f"
              inner=$(unzip -Z1 "$f" '*.apk' | while read -r x; do echo "$(unzip -Zl "$f" "$x" | awk 'NR==1{print $4}') $x"; done | sort -rn | sed -n 1p | cut -d' ' -f2-)
              unzip -p "$f" "$inner" > client.apk
            else cp "$f" client.apk; fi
            "$bt/aapt2" dump badging client.apk | sed -n 1p
            "$bt/apksigner" verify --print-certs client.apk 2>&1 | grep -i 'SHA-256' | head -2
            unzip -l client.apk 'classes*.dex' | tail -3
            echo "::group::test $v"
            rm -f report.md
            TELEVIP_CLIENT_APK="$PWD/client.apk" TELEVIP_CLIENT_REPORT="$PWD/report.md" ./gradlew :app:testDebugUnitTest --rerun --tests 'com.my.televip.obfuscate.resolve.ClientApkTest' < /dev/null > gradle.log 2>&1 || echo "TEST FAILED"
            tail -5 gradle.log
            echo "::endgroup::"
            echo "=== REPORT $v"; cat report.md || true; echo "=== END"
          done
