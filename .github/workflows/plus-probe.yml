name: Plus probe
on:
  push:
    branches: [claude/plus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Try sources
        run: |
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          echo "== apkpure plain"; curl -sS -o /dev/null -D - -m 60 'https://d.apkpure.com/b/APK/org.telegram.plus?version=latest' | head -20 || true
          echo "== apkpure UA"; curl -sS -o /dev/null -D - -m 60 -A "$UA" 'https://d.apkpure.com/b/XAPK/org.telegram.plus?version=latest' | head -20 || true
          echo "== apkeep"
          url=$(curl -fsSL https://api.github.com/repos/EFForg/apkeep/releases/latest | jq -r '.assets[] | select(.name|test("x86_64-unknown-linux-gnu$")) | .browser_download_url')
          echo "$url"; curl -fsSL -o apkeep "$url" && chmod +x apkeep
          mkdir -p out && ./apkeep -a org.telegram.plus -d apk-pure out 2>&1 | tail -5 || true
          ls -la out || true
          echo "== uptodown"
          page=$(curl -sSL -m 60 -A "$UA" https://plus-messenger.en.uptodown.com/android/download || true)
          echo "$page" | grep -o 'data-url="[^"]*"' | head -3
          echo "$page" | grep -o 'class="version"[^<]*<' | head -3
          echo "== apkcombo"; curl -sS -o /dev/null -w '%{http_code}\n' -m 60 -A "$UA" https://apkcombo.com/plus-messenger/org.telegram.plus/download/apk || true
          echo "== apkmirror"; curl -sS -o /dev/null -w '%{http_code}\n' -m 60 -A "$UA" https://www.apkmirror.com/apk/rafalense/plus-messenger/ || true
