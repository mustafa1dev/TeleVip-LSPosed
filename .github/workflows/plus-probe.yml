name: Plus probe
on:
  push:
    branches: [claude/plus-probe]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release delete plus-probe -R "$GITHUB_REPOSITORY" -y --cleanup-tag || gh release delete plus-probe -R "$GITHUB_REPOSITORY" -y
